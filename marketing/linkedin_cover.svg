<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1128 191" width="1128" height="191" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1128" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#0d0d10"/>
      <stop offset="100%" stop-color="#0f1018"/>
    </linearGradient>
    <radialGradient id="leftGlow" cx="22%" cy="50%" r="38%">
      <stop offset="0%"   stop-color="#0A84FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0A84FF" stop-opacity="0.0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1128" height="191" fill="url(#bg)"/>
  <rect width="1128" height="191" fill="url(#leftGlow)"/>

  <!-- ── Pitch circle: left side ── -->
  <!-- Outer ring -->
  <circle cx="210" cy="95" r="165" fill="#0A84FF" fill-opacity="0.05" stroke="#0A84FF" stroke-width="1.4" stroke-opacity="0.38"/>
  <!-- Midfield line -->
  <line x1="45" y1="95" x2="375" y2="95" stroke="#0A84FF" stroke-width="1.1" stroke-opacity="0.38"/>
  <!-- Center circle -->
  <circle cx="210" cy="95" r="62" stroke="#0A84FF" stroke-width="1.1" stroke-opacity="0.38" fill="none"/>
  <!-- Center spot -->
  <circle cx="210" cy="95" r="3" fill="#0A84FF" fill-opacity="0.35"/>
  <!-- Player glow -->
  <circle cx="210" cy="46" r="36" fill="#0A84FF" fill-opacity="0.06"/>
  <circle cx="210" cy="46" r="22" fill="#0A84FF" fill-opacity="0.12"/>
  <circle cx="210" cy="46" r="12" fill="#0A84FF" fill-opacity="0.22"/>
  <!-- Player dot -->
  <circle cx="210" cy="46" r="6" fill="#0A84FF"/>

  <!-- Second faint circle (far left, decorative) -->
  <circle cx="30" cy="150" r="80" fill="none" stroke="#0A84FF" stroke-width="0.7" stroke-opacity="0.08"/>

  <!-- Scattered data dots (transition zone) -->
  <circle cx="420" cy="70"  r="1.8" fill="#0A84FF" fill-opacity="0.20"/>
  <circle cx="438" cy="110" r="1.8" fill="#0A84FF" fill-opacity="0.14"/>
  <circle cx="455" cy="55"  r="1.8" fill="#0A84FF" fill-opacity="0.18"/>
  <circle cx="468" cy="130" r="1.8" fill="#0A84FF" fill-opacity="0.12"/>
  <circle cx="482" cy="85"  r="1.8" fill="#0A84FF" fill-opacity="0.16"/>

  <!-- ── Catchphrase: large, right-aligned ── -->
  <text
    x="1072" y="105"
    text-anchor="end"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="40" font-weight="800" letter-spacing="-1.2"
    fill="#f5f5f7">Score by role.</text>

  <text
    x="1072" y="152"
    text-anchor="end"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="40" font-weight="800" letter-spacing="-1.2"
    fill="#f5f5f7">Compare across leagues.</text>

  <!-- ── PlayerScore: small, bottom right ── -->
  <text
    x="1072" y="178"
    text-anchor="end"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="13" font-weight="600" letter-spacing="0.2"
    fill="#3a3a3c">Player<tspan fill="#0A84FF" fill-opacity="0.7">Score</tspan></text>

  <!-- Bottom accent -->
  <line x1="0" y1="190" x2="1128" y2="190" stroke="#0A84FF" stroke-width="1.2" stroke-opacity="0.25"/>
</svg>
