name: PlayerScore — Current Season Update (Sofascore)

on:
  schedule:
    - cron: "0 6 * * 2"   # Tuesday 06:00 UTC
  workflow_dispatch:
    inputs:
      do_scrape:
        description: "Scrape Sofascore (false = process and publish only)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: playerscore-current-season
  cancel-in-progress: true

jobs:
  run-pipeline:
    runs-on: [self-hosted, macOS, X64, playerscore]
    timeout-minutes: 300
    env:
      WEB_REPO_TOKEN: ${{ secrets.WEB_REPO_TOKEN }}

    steps:
      # The self-hosted Mac otherwise slips into idle sleep during the run —
      # most often already during Checkout/setup, before the pipeline step —
      # which drops the runner connection ("runner lost communication").
      # Start a detached keep-awake before anything else so the machine stays
      # up from second one. It survives across steps (orphaned) and is reaped
      # by the runner's orphan cleanup at job end; -t caps it as a safety net.
      # No sudo needed. (-s only binds on AC power.)
      - name: Keep the Mac awake for the whole job
        shell: bash
        run: |
          pkill -f 'caffeinate -dimsu' 2>/dev/null || true
          nohup caffeinate -dimsu -t 16200 >/dev/null 2>&1 &
          disown 2>/dev/null || true
          echo "keep-awake started"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # Raw data is not in git; it lives in a persistent store on the runner
      # and is linked into the fresh checkout (checkout's git clean removes
      # the link each run, never the store behind it).
      - name: Link persistent raw data store
        shell: bash
        run: |
          mkdir -p "$HOME/playerscore-data/Raw"
          rm -rf Data/Raw
          ln -sfn "$HOME/playerscore-data/Raw" Data/Raw
          ls Data/Raw/

      - name: Set up venv + deps
        shell: bash
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r streamlit/requirements.txt
          pip install playwright
          python -m playwright install chromium

      - name: Run weekly Sofascore pipeline
        shell: bash
        env:
          SCRAPE_TRANSFERMARKT: "true"
          SOFA_DELAY: "1.5,3"   # polite throttling, the run is not time-critical
          DO_SCRAPE: ${{ github.event_name == 'workflow_dispatch' && inputs.do_scrape == false && 'false' || 'true' }}
        run: |
          source .venv/bin/activate
          python streamlit/run_weekly_sofa.py

      - name: Write data version file
        shell: bash
        run: |
          mkdir -p Data/Processed
          echo "$(date -u +'%Y-%m-%d %H:%M:%S UTC')" > Data/Processed/_last_update.txt

      - name: Commit & push data repo
        shell: bash
        run: |
          git config user.name "Stefan Hofmann"
          git config user.email "stefan.hofmann.es@gmail.com"
          git add Data/Processed
          git commit -m "Weekly Sofascore run $(date -u +'%Y-%m-%d %H:%M UTC')" --allow-empty
          git push

      # The website lives in the separate playerscore-web repo (Vercel).
      # Needs a repo secret WEB_REPO_TOKEN (PAT with write access to
      # TwinAnalytics/playerscore-web); without it this step is skipped.
      - name: Sync website data (playerscore-web -> Vercel)
        if: ${{ env.WEB_REPO_TOKEN != '' }}
        shell: bash
        run: |
          rm -rf /tmp/playerscore-web
          git clone --depth 1 "https://x-access-token:${WEB_REPO_TOKEN}@github.com/TwinAnalytics/playerscore-web.git" /tmp/playerscore-web
          cp Data/Processed/player_scores_all_seasons_long.csv \
             Data/Processed/player_scores_agg_by_player.csv \
             Data/Processed/squad_scores_all_seasons.csv \
             Data/Processed/player_market_values.csv \
             Data/Processed/player_sofa_metrics.csv \
             Data/Processed/player_shots-*.csv \
             Data/Processed/player_gk_shots-*.csv \
             Data/Processed/player_heat-*.csv \
             /tmp/playerscore-web/public/data/
          cd /tmp/playerscore-web
          # Vercel (Hobby plan) blocks deployments whose commit author email
          # does not match a connected GitHub account. Use the account-verified
          # email so the auto-deploy is not blocked. (github-actions@github.com
          # matches no account and blocked every deploy since 2026-08-28.)
          git config user.name "Stefan Hofmann"
          git config user.email "stefan.hofmann.es@gmail.com"
          git add public/data
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "Weekly data refresh $(date -u +'%Y-%m-%d')"
          git push

      - name: Stop keep-awake
        if: always()
        shell: bash
        run: pkill -f 'caffeinate -dimsu' 2>/dev/null || true
